  var cls='node '+(n.cat<0?'catg':'cat'+n.cat);
  var g=document.createElementNS(NS,'g');g.setAttribute('class',cls);g.setAttribute('data-i',String(i));g.setAttribute('transform','translate('+n.x+','+n.y+')');
  var cc=document.createElementNS(NS,'circle');cc.setAttribute('r',String(n.r));
  g.appendChild(cc);
  a.appendChild(g);gNode.appendChild(a);nodeEls.push(g);}

// 节点标签：所有节点都建标签，低关联节点默认隐藏、悬停时才现
// 第一轮高关联节点贪心落位（常显），第二轮其余节点落位（默认隐藏）
var mcv=document.createElement('canvas'),mctx=mcv.getContext('2d');
function tw(s){mctx.font='10px system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';return mctx.measureText(s).width;}
var occ=[];
function hits(r){for(var k=0;k<occ.length;k++){var o=occ[k];if(!(r.x2<o.x1||o.x2<r.x1||r.y2<o.y1||o.y2<r.y1))return true;}return false;}
function addLabel(k,nd,dx,dy,an,base){var t=document.createElementNS(NS,'text');t.setAttribute('class','nlabel '+base);t.setAttribute('x',String(nd.x+dx));t.setAttribute('y',String(nd.y+dy));t.setAttribute('text-anchor',an);t.textContent=nd.label.length>10?nd.label.slice(0,10)+'…':nd.label;gNodeLabel.appendChild(t);labelEls[k]={el:t,dx:dx,dy:dy};}
function placeLabel(k,base){
  var nd=nodes[k];var w=tw(nd.label.length>10?nd.label.slice(0,10)+'…':nd.label);
  var cands=[[0,nd.r+13,'middle'],[0,-(nd.r+7),'middle'],[nd.r+6,3,'start'],[-(nd.r+6),3,'end']];
  for(var z=0;z<cands.length;z++){var dx=cands[z][0],dy=cands[z][1],an=cands[z][2];var ax=nd.x+dx,ay=nd.y+dy;
    var x1=an==='middle'?ax-w/2:(an==='start'?ax:ax-w);
    var rect={x1:x1-3,y1:ay-9,x2:x1+w+3,y2:ay+3};
    if(hits(rect))continue;
    occ.push(rect);addLabel(k,nd,dx,dy,an,base);return;
  }
  // 四个位置都被占：低关联节点退回默认位（只在悬停时显示，允许少量重叠）
  if(base==='lh')addLabel(k,nd,0,nd.r+13,'middle',base);
}
var hubs=[],rest=[];
for(i=0;i<nodes.length;i++)(nodes[i].degree>=6?hubs:rest).push(i);
hubs.sort(function(a,b){return nodes[b].degree-nodes[a].degree;});
for(i=0;i<hubs.length;i++)placeLabel(hubs[i],'f'+tier(nodes[hubs[i]].degree));
rest.sort(function(a,b){return nodes[b].degree-nodes[a].degree;});
for(i=0;i<rest.length;i++)placeLabel(rest[i],'lh');

function updLine(e){var l=links[e];lineEls[e].setAttribute('x1',nodes[l.s].x);lineEls[e].setAttribute('y1',nodes[l.s].y);lineEls[e].setAttribute('x2',nodes[l.t].x);lineEls[e].setAttribute('y2',nodes[l.t].y);}
function setPos(i,x,y){nodes[i].x=x;nodes[i].y=y;nodeEls[i].setAttribute('transform','translate('+x+','+y+')');var L=labelEls[i];if(L){L.el.setAttribute('x',String(x+L.dx));L.el.setAttribute('y',String(y+L.dy));}for(var k=0;k<inc[i].length;k++)updLine(inc[i][k].e);}

function showTip(n,e){var s='<div class="t1">'+esc(n.label)+'</div>';if(n.date)s+='<div class="t2">'+esc(n.date)+(n.tags&&n.tags.length?' · #'+esc(n.tags.join(' #')):'')+'</div>';if(n.text)s+='<div class="t3">'+esc(n.text)+'</div>';s+='<div class="t2">关联 '+n.degree+' 条笔记</div>';tip.innerHTML=s;tip.style.display='block';moveTip(e);}
function moveTip(e){var w=tip.offsetWidth,h=tip.offsetHeight;var x=e.clientX+14,y=e.clientY+14;if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(y+h>window.innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}

function hoverOn(i){for(var k=0;k<nodes.length;k++)nodeEls[k].classList.add('dim');for(var k=0;k<labelEls.length;k++)if(labelEls[k])labelEls[k].el.classList.add('dim');for(var e=0;e<lineEls.length;e++)lineEls[e].classList.add('dim');nodeEls[i].classList.remove('dim');nodeEls[i].classList.add('hl');if(labelEls[i]){labelEls[i].el.classList.remove('dim');labelEls[i].el.classList.add('hl');}for(var k=0;k<inc[i].length;k++){var e=inc[i][k].e;lineEls[e].classList.remove('dim');lineEls[e].classList.add('hl');var o=inc[i][k].o;nodeEls[o].classList.remove('dim');nodeEls[o].classList.add('nb');if(labelEls[o]){labelEls[o].el.classList.remove('dim');labelEls[o].el.classList.add('nb');}}}
function hoverOff(){for(var k=0;k<nodes.length;k++){nodeEls[k].classList.remove('dim');nodeEls[k].classList.remove('hl');nodeEls[k].classList.remove('nb');}for(var k=0;k<labelEls.length;k++)if(labelEls[k]){labelEls[k].el.classList.remove('dim');labelEls[k].el.classList.remove('hl');labelEls[k].el.classList.remove('nb');}for(var e=0;e<lineEls.length;e++){lineEls[e].classList.remove('dim');lineEls[e].classList.remove('hl');}}

svg.addEventListener('pointerover',function(e){var g=e.target.closest?e.target.closest('.node'):null;if(!g)return;var i=Number(g.getAttribute('data-i'));hoverOn(i);showTip(nodes[i],e);});
svg.addEventListener('pointerout',function(e){var g=e.target.closest?e.target.closest('.node'):null;if(!g)return;hoverOff();hideTip();});
svg.addEventListener('pointermove',function(e){if(tip.style.display==='block')moveTip(e);});

var drag=null,moved=false;
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
svg.addEventListener('pointerdown',function(e){var g=e.target.closest?e.target.closest('.node'):null;if(!g)return;drag=Number(g.getAttribute('data-i'));moved=false;try{svg.setPointerCapture(e.pointerId);}catch(_){}});
svg.addEventListener('pointermove',function(e){if(drag==null)return;var p=pt(e);if(!p)return;var n=nodes[drag];var dx=p.x-n.x,dy=p.y-n.y;setPos(drag,p.x,p.y);if(dx*dx+dy*dy>9)moved=true;});
function up(){drag=null;}
svg.addEventListener('pointerup',up);
svg.addEventListener('pointercancel',up);
svg.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);

var themeBtn=document.getElementById('theme');
themeBtn.addEventListener('click',function(){var h=document.documentElement;var d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');});
})();
</script>
</body>
</html>
