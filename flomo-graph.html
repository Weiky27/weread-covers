var W=960,H=640,NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('s');
function el(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
function color(d){return d>=8?'#166534':(d>=4?'#15803d':(d>=1?'#4ade80':'#cbd5e1'));}
var nodes=DATA.nodes.map(function(n){
  var deg=n.degree||0;
  return {id:n.id,label:n.label,url:n.url,degree:deg,
    r:4+Math.min(14,Math.sqrt(deg)*2.6),
    x:W/2+(Math.random()-0.5)*120,y:H/2+(Math.random()-0.5)*120,vx:0,vy:0};
});
var idMap={};for(var i=0;i<nodes.length;i++)idMap[nodes[i].id]=i;
var links=[];for(var j=0;j<DATA.edges.length;j++){var e=DATA.edges[j];if(idMap[e.a]!=null&&idMap[e.b]!=null)links.push({s:idMap[e.a],t:idMap[e.b]});}

var lineLayer=el('g',{});svg.appendChild(lineLayer);
var nodeLayer=el('g',{});svg.appendChild(nodeLayer);
var lineEls=links.map(function(){var e=el('line',{class:'link'});lineLayer.appendChild(e);return e;});
var nodeEls=nodes.map(function(n,i){
  var a=el('a',{href:n.url,target:'_blank',rel:'noopener'});
  var g=el('g',{class:'node','data-id':String(i)});
  var c=el('circle',{r:String(n.r),fill:color(n.degree)});
  var t=el('title',{});t.textContent=n.label;
  g.appendChild(c);g.appendChild(t);
  if(n.degree>=3){var lbl=n.label.length>10?n.label.slice(0,10)+'…':n.label;var tx=el('text',{y:String(n.r+11)});tx.textContent=lbl;g.appendChild(tx);}
  a.appendChild(g);nodeLayer.appendChild(a);
  return g;
});

var REP=800,SPRING=0.04,REST=55,DAMP=0.9,CENTER=0.006;
function tick(){
  var i,j,a,b,dx,dy,d,d2,f,fx,fy,l;
  for(i=0;i<nodes.length;i++){a=nodes[i];
    for(j=i+1;j<nodes.length;j++){b=nodes[j];dx=a.x-b.x;dy=a.y-b.y;d2=dx*dx+dy*dy;
      if(d2<1){dx=Math.random()-0.5;dy=Math.random()-0.5;d2=1;}
      d=Math.sqrt(d2);f=REP/d;fx=dx/d*f;fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}
  for(i=0;i<links.length;i++){l=links[i];a=nodes[l.s];b=nodes[l.t];dx=b.x-a.x;dy=b.y-a.y;d=Math.max(1,Math.sqrt(dx*dx+dy*dy));f=(d-REST)*SPRING;fx=dx/d*f;fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
  for(i=0;i<nodes.length;i++){a=nodes[i];a.vx+=(W/2-a.x)*CENTER;a.vy+=(H/2-a.y)*CENTER;}
  for(i=0;i<nodes.length;i++){a=nodes[i];a.vx*=DAMP;a.vy*=DAMP;a.vx=Math.max(-8,Math.min(8,a.vx));a.vy=Math.max(-8,Math.min(8,a.vy));a.x+=a.vx;a.y+=a.vy;a.x=Math.max(a.r,Math.min(W-a.r,a.x));a.y=Math.max(a.r,Math.min(H-a.r,a.y));}
  for(i=0;i<links.length;i++){l=links[i];a=nodes[l.s];b=nodes[l.t];lineEls[i].setAttribute('x1',a.x);lineEls[i].setAttribute('y1',a.y);lineEls[i].setAttribute('x2',b.x);lineEls[i].setAttribute('y2',b.y);}
  for(i=0;i<nodes.length;i++){nodeEls[i].setAttribute('transform','translate('+nodes[i].x+','+nodes[i].y+')');}
}

var drag=null,moved=false;
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
svg.addEventListener('pointerdown',function(e){var g=e.target.closest?e.target.closest('.node'):null;if(!g){drag=null;return;}drag=Number(g.getAttribute('data-id'));moved=false;try{svg.setPointerCapture(e.pointerId);}catch(_){}});
svg.addEventListener('pointermove',function(e){if(drag==null)return;var p=pt(e);if(!p)return;var n=nodes[drag];var dx=p.x-n.x,dy=p.y-n.y;n.x=p.x;n.y=p.y;n.vx=0;n.vy=0;if(dx*dx+dy*dy>9)moved=true;});
function up(){drag=null;}
svg.addEventListener('pointerup',up);
svg.addEventListener('pointercancel',up);
svg.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);

tick();
setInterval(tick,16);
})();
